name: Publish package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upstream:
        description: Promote a verified automatic upstream candidate
        type: boolean
        default: false

env:
  UPSTREAM_UPDATE: ${{ inputs.upstream || false }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .build/xed
            .build/mbuild
            .build/emsdk
          key: xed-sources-${{ runner.os }}-${{ hashFiles('upstream.json') }}
      - run: |
          if [ "$UPSTREAM_UPDATE" != true ]; then
            test "$GITHUB_REF_TYPE" = tag
            test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          fi
      - name: Verify release maintenance
        run: node --test test/release-assets.test.mjs test/upstream-release.test.mjs test/upstream-promotion.test.mjs test/registry-release.test.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build:wasm
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run verify:package
      - name: Pack and test release tarball
        run: |
          npm pack --ignore-scripts --json > pack-result.json
          node scripts/test-tarball.mjs
          sha256sum "$(node -p 'require("./pack-result.json")[0].filename')" > package.sha256
      - name: Promote verified upstream candidate
        if: github.event_name == 'workflow_dispatch' && inputs.upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/promote-upstream.mjs
      - name: Check immutable npm release
        id: registry
        run: node scripts/check-release.mjs
      - name: Publish exact tested tarball to npm
        if: steps.registry.outputs.exists == 'false'
        run: npm publish "$(node -p 'require("./pack-result.json")[0].filename')" --ignore-scripts --access public --provenance
      - name: Create or verify immutable GitHub release
        run: node scripts/publish-release.mjs dist/build-info.json
        env:
          GH_TOKEN: ${{ github.token }}
